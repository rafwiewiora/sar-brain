</style><main><header><strong>SAR Brain</strong><label>Campaign <select id="target"></select></label><label>Strategy <select id="policy"></select></label><label id="routeLabel" hidden>Oracle route <select id="route"><option value="fep">Shortest FEP path</option><option value="direct">Direct synthesis</option></select></label><label id="cutLabel">LoMap ≥ <select id="cut"><option>0.60</option><option>0.70</option><option>0.80</option><option>0.90</option></select></label><label id="errorLabel">Difficulty <select id="error"><option value="ideal">Ideal (0 error)</option><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><label class="slideSwitch"><input type="checkbox" checked id="withSlides"> Step slides</label><a id="storyLink">Story slides</a><a id="boardLink" href="medicinal_chemistry_world_map.html">Play the board</a></header>
<figure id="scene"><section class="pane"><div class="paneLabel">Agent decision <span>Selected action</span></div><iframe id="game" title="Medicinal chemistry board"></iframe></section><section class="pane"><div class="paneLabel">Campaign state <span>Recorded state</span></div><iframe id="brainPane" title="SAR Brain campaign viewer"></iframe></section></figure><section id="stepSheet" aria-label="Replay slide" hidden><article><small id="sheetKicker"></small><h1 id="sheetTitle"></h1><div id="sheetVisual"></div><p id="sheetNote"></p><button id="reveal">Play this move →</button></article></section><nav><button id="prev" aria-label="Previous action">←</button><button id="play">Play</button><button id="next" aria-label="Next action">→</button><output id="count" aria-live="polite"></output><input id="scrub" type="range" min="0" aria-label="Replay action"><label>Inspect <select id="focus"></select></label></nav><footer><strong id="sample"></strong> <span id="rule"></span></footer></main>
<script id="data" type="application/json">__DATA__</script><script>__SCENE__
const data=JSON.parse(document.querySelector('#data').textContent),$=id=>document.getElementById(id);
let index=0,timer=null, projection,liveLevel,generation=0,tick=0,ready=new Set(),painted=new Set();
const frameEl=side=>$(side==='board'?'game':'brainPane');
function fit(){
 for(const el of [$('game'),$('brainPane')]){
  const box=el.parentElement.getBoundingClientRect(),w=Math.max(1000,box.width),scale=box.width/w;
  el.style.width=w+'px';el.style.height=Math.floor((box.height-25)/scale)+'px';el.style.transform='scale('+scale+')';
 }
}
new ResizeObserver(fit).observe($('scene'));window.addEventListener('resize',fit);
function put(side,msg){frameEl(side).contentWindow.postMessage(msg,'*');}
let phase='settled',inspected=false;
let playing=false,oneMove=false,segment='intro',remaining=0,deadline=0,deck=null;
// Narration belongs to the published RENIN replay and its paired SAR comparison.
const reninStory = [
 {action:'open',seconds:7,after:['Find a 1 nM renin inhibitor','Start with 15 assays. Each new synthesis step and each simulated FEP prediction costs $1.']},
 {action:'query',count:5,seconds:7,before:['Which molecules look worth making?','The agent can predict five neighbors of its measured compounds. Other candidates keep their SAR estimates.'],after:['Five predictions change the shortlist','CPD 177 rises to first. The agent commits to two compounds in this batch.']},
 {action:'make',name:'CPD 177',seconds:8,before:['Test the first prediction','CPD 177 ranks first with FEP. Preparing and assaying it takes nine synthesis steps.'],after:['The first prediction is too optimistic','FEP predicted 78 nM for CPD 177. The assay gives 513 nM.'],focus:'assay',tone:'caution'},
 {action:'make',name:'CPD 121',seconds:7,before:['The first synthesis also made an intermediate','Reusing it cuts the price of CPD 121 from nine steps to two.'],after:['Two more steps buy a stronger compound','CPD 121 measures 115 nM. Its batch partner already paid for the shared chemistry.'],focus:'price'},
 {action:'query',count:19,seconds:7,before:['New references extend FEP’s reach','The two assays make 19 more compounds eligible for prediction.'],after:['Choose the next pair','Using the new predictions and current synthesis prices, the agent selects CPD 223 and CPD 239.']},
 {action:'make',name:'CPD 223',seconds:7,before:['Test the next prediction','CPD 223 takes two steps from the current stock.'],after:['CPD 223 sets a new best','Its measured potency is 6 nM. One more compound is already committed in this batch.'],focus:'assay'},
 {action:'make',name:'CPD 239',seconds:8,before:['Make the second compound in the batch','CPD 239 also takes two synthesis steps. Its assay will make it available as an FEP reference.'],after:['A weaker compound opens the decisive link','At 9 nM, CPD 239 trails the 6 nM lead. It gives the agent its first eligible FEP link to CPD 270.'],focus:'link'},
 {action:'query',count:1,seconds:8,before:['One new prediction is available','CPD 270 ranks eighth under the active strategy. The agent can now query it from CPD 239.'],after:['One prediction changes the decision','FEP predicts 1.01 nM. CPD 270 moves from eighth to first. Both SAR columns still rank it fourteenth.'],focus:'rank'},
 {action:'make',name:'CPD 270',seconds:12,before:['Spend two steps to test CPD 270','The 1.01 nM value is a noisy prediction. The agent must make the compound and assay it.'],after:['The assay confirms 1 nM','This replay used 17 synthesis steps versus 21 for SAR + cost (19% fewer). With 25 FEP queries, it spent $42 versus $21.'],focus:'assay'}
];
let narrated=false;
function duration(){
 if(liveLevel.key==='RENIN'&&run().frames[index].liveRanks)return narrated?reninStory[index].seconds:index?4.3:3;
 return Math.max(run().frames[index].liveRanks?3.6:1.05,projection.D.paths.movie[index].seconds??2.6);
}
const moments=[['aim',0],['press',.17],['pop',.39],['settled',.85]];
let rankProgress=null;
function setPhase(value,progress=null){
 rankProgress=progress;phase=value;tick++;painted.clear();delete document.body.dataset.ready;sync();
}
function sync(){
 if(!projection||ready.size<2)return;
 const f=run().frames[index],intent=f.action==='open'?'':f.action;
 const after=phase==='pop'||phase==='settled',prior=Math.max(0,index-1),at=after?index:prior;
 const old=run().frames[prior],dq=f.queries-old.queries,ds=f.spent-old.spent;
 const delta={queries:dq,steps:ds,money:dq+ds};
 const focus=projection.node($('focus').value),beat=projection.D.paths.movie[index];
 const pair=phase==='settled'&&['prediction','assay'].includes(beat.beat)&&projection.cid(focus)===beat.candidate?
   {from:projection.node(beat.reference),to:projection.node(beat.candidate),measured:beat.beat==='assay'}:null;
 const cue=narrated?reninStory[index]:null;
 const story=cue&&$('withSlides').checked?{lines:after?cue.after:cue.before,focus:after?cue.focus:undefined,tone:cue.tone}:null;
 const decision={story,ranking:f.ranking,beforeRanks:old.liveRanks,afterRanks:f.liveRanks,
   axisCount:run().frames[0].liveRanks?.entries.length,progress:rankProgress,animateMs:duration()*210,parents:f.parents,model:f.decision?.model,estimate:f.decision?.estimate,unlocked:[]};
 if(liveLevel.key==='RENIN'&&intent==='make'&&!isOracle()&&[2,3].includes(+$('policy').value)){
  const priorSet=new Set(old.made),now=new Set(f.made);
  const reachable=new Set();
  for(const [a,b] of liveLevel.edges){if(priorSet.has(a))reachable.add(b);if(priorSet.has(b))reachable.add(a);}
  const newly=new Set();
  for(const [a,b] of liveLevel.edges){
   if(now.has(a)&&!now.has(b)&&!reachable.has(b))newly.add(b);
   if(now.has(b)&&!now.has(a)&&!reachable.has(a))newly.add(a);
  }
  decision.unlocked=[...newly];
 }
 put('board',{type:'board-frame',index,tick,phase,delta,pair,focus,decision,inspected,f:projection.states[at],
   info:after?beat.caption:'',playAction:intent==='query'&&!isOracle()?'query-all':intent,targets:f.targets,cutoff:$('cut').value,archived:false,setting:isOracle()?'ideal':$('error').value});
 put('brain',{type:'brain-frame',autoView:narrated&&$('withSlides').checked?(index===2||index===3?'retro':'brain'):null,watchSquare:narrated&&$('withSlides').checked&&index===2?'CPD_121':null,moveIndex:index,index:at,tick,phase,delta,focus:projection.cid(after?focus:old.targets[old.targets.length-1])});
}
window.addEventListener('message',e=>{
 const side=['board','brain'].find(k=>e.source===frameEl(k).contentWindow);if(!side)return;
 if(e.data?.type==='loaded'){if(e.data.generation!==generation)return;ready.add(side);sync();if(ready.size===2&&timer===null)schedule(remaining);}
 if(e.data?.type==='painted'&&e.data.tick===tick){painted.add(side);if(painted.size===2)document.body.dataset.ready=String(tick);}
 if(e.data?.type==='navigate'){if(e.data.delta===0)$('play').click();else if(e.data.delta>0)forward();else step(index-1);}
});
function embed(template,marker,payload){
 const safe=JSON.stringify(payload).replaceAll('<','\\u003c');
 return template.replace(marker,()=>safe).replaceAll("type:'loaded',side:","generation:"+generation+",type:'loaded',side:");
}

let active;
const isOracle=()=>$('policy').value==='oracle';
const board=()=>data.boards[$('target').value],run=()=>active;
function options(el,items){el.replaceChildren(...items.map(([v,t])=>new Option(t,v)));}
function cancelClock(){clearTimeout(timer);timer=null;}
function schedule(ms){
 cancelClock();remaining=ms;
 if((!playing&&!oneMove)||ready.size!==2)return;
 deadline=performance.now()+remaining;
 timer=setTimeout(advanceClock,remaining);
}
function setPlaying(value){
 oneMove=false;
 if(value===playing){if(!value)cancelClock();return;}
 if(!value&&timer!==null)remaining=Math.max(0,deadline-performance.now());
 playing=value;$('play').textContent=playing?'Pause':'Play';
 if(playing)schedule(remaining);else cancelClock();
}
function genericCard(f){
 const b=board(),previous=run().frames[Math.max(0,index-1)];
 const title=f.action==='open'?'Start with '+f.made.length+' measured references':f.action==='query'?'Predict '+f.targets.length+' eligible compounds':'Make and assay '+b.products[f.targets[0]].name;
 const ids=f.targets.slice(0,3),visual='<div class="gallery">'+ids.map(n=>'<div class="mol">'+b.drawings[n]+'<b>'+b.products[n].name+'</b></div>').join('')+'</div>';
 const foot=f.action==='make'?(f.spent-previous.spent)+' synthesis steps from current inventory.':f.action==='query'?'One simulated FEP query per eligible compound.':'Opening compounds and their assays are supplied.';
 return [title,visual,foot];
}
function cardForStep(){
 const f=run().frames[index];
 if(!deck)return genericCard(f);
 const slide=narrated?[1,2,3,4,null,null,5,6,7][index]:deck.slideForFrame.get(f);
 if(slide===undefined)return genericCard(f);
 if(narrated&&index===0)return [deck.slides[slide][0],deck.slides[slide][1],reninStory[0].after[1]+' The goal is a 1 nM inhibitor.'];
 if(slide!==null)return deck.slides[slide];
 if(f.action==='query')return [reninStory[index].before[0],deck.ledger([[f.targets.length,'new FEP queries'],['$'+(f.queries-run().frames[index-1].queries),'cost of this screen']]),reninStory[index].before[1]];
 return [reninStory[index].before[0],deck.gallery([deck.mol(f.targets[0],'Selected for assay')]),reninStory[index].before[1]];
}
function layoutSheet(){
 const r=$('scene').getBoundingClientRect();
 document.documentElement.style.setProperty('--sheet-top',Math.max(0,r.top)+'px');
 document.documentElement.style.setProperty('--sheet-bottom',Math.max(0,innerHeight-r.bottom)+'px');
}
function showCard(card,closing=false){
 $('stepSheet').classList.toggle('victory',closing&&run().won);
 layoutSheet();$('sheetKicker').textContent=$('target').value+' · '+(closing?'Campaign result':'Move '+(index+1)+' of '+run().frames.length);
 $('sheetTitle').textContent=card[0];$('sheetVisual').innerHTML=card[1];$('sheetNote').innerHTML=card[2];
 $('reveal').textContent=closing?'Return to the campaign':'Play this move →';$('stepSheet').hidden=false;
}
function startAction(){
 $('stepSheet').hidden=true;segment='action';oneMove=!playing&&index>0;
 setPhase(index?'aim':'settled');schedule(duration()*1000*(index?moments[1][1]:1));
}
function finishReplay(){
 cancelClock();segment='finished';$('stepSheet').hidden=true;setPlaying(false);remaining=0;$('next').disabled=true;
}
function advanceClock(){
 cancelClock();
 if(segment==='intro'){startAction();return;}
 if(segment==='outro'){finishReplay();return;}
 const pos=moments.findIndex(([name])=>name===phase);
 if(pos<3){
  setPhase(moments[pos+1][0]);
  if(phase==='settled'){
   if(winningMove()){showVictory();return;}
   oneMove=false;
  }
  schedule(duration()*1000*((moments[pos+2]?.[1]??1)-moments[pos+1][1]));return;
 }
 if(index<run().frames.length-1){show(index+1);return;}
 if(winningMove()){showVictory();return;}
 finishReplay();
}
function winningMove(){return run().won&&index===run().frames.length-1&&run().frames[index].action==='make';}
function showVictory(){
 setPlaying(false);segment='outro';
 const f=run().frames[index],b=board(),id=f.made.reduce((best,n)=>b.products[n].p>b.products[best].p?n:best);
 const potency=Number((10**(9-b.products[id].p)).toPrecision(3))+' nM';
 const detail=b.products[id].name+' · '+potency+' measured';
 const costs=f.spent+' synthesis steps · '+f.queries+' FEP queries · $'+(f.spent+f.queries)+' spent';
 showCard(['Campaign won',b.drawings[id]+'<h2>'+detail+'</h2>',costs+(narrated?' · 19% fewer synthesis steps than SAR + cost (21 steps).':'')],true);
 $('reveal').focus();
}
window.addEventListener('resize',layoutSheet);

function show(i,keep=false){
 inspected=keep;
 const r=run(),b=board();index=Math.max(0,Math.min(i,r.frames.length-1));const f=r.frames[index];
 if(!keep){options($('focus'),f.targets.map(n=>[n,b.products[n].name]));$('focus').value=f.targets.reduce((a,c)=>(f.action==='query'?(f.forecasts?.[a]??b.products[a].p)>(f.forecasts?.[c]??b.products[c].p):b.products[a].p>b.products[c].p)?a:c);}
 const beat=projection.D.paths.movie[index];
 if(!keep&&beat.beat==='prediction')$('focus').value=projection.node(beat.candidate);
 if(keep){sync();return;}
 cancelClock();oneMove=false;$('stepSheet').hidden=true;
 if($('withSlides').checked){
  segment='intro';setPhase(index?'aim':'settled');showCard(cardForStep());schedule(index===2&&deck?9000:6000);
 }else startAction();
 $('count').textContent=(index+1)+' / '+r.frames.length;$('scrub').max=r.frames.length-1;$('scrub').value=index;
 $('prev').disabled=index===0;$('next').disabled=false;
 $('rule').textContent=r.rule+(index===r.frames.length-1?'  '+(r.end||(Math.max(...f.made.map(n=>b.products[n].p))===Math.max(...Object.values(b.products).map(x=>x.p))?'Winner assayed.':'No eligible move remains.')):'');
}
function setup(){
 setPlaying(false);const i=+$('policy').value;
 const cutoff=+$('cut').value,error=$('error').value;
 const oracle=isOracle(),usesFep=i===2||i===3;
 const summary=usesFep&&error!=='ideal'?data.draws[$('target').value][[i,cutoff,error]]:null;
 const level=summary?sampledLevel(board(),summary.seed):board();
 active=oracle?hindsightReplay(level,cutoff,$('route').value==='direct'):playStrategy(level,moviePolicies[i],cutoff,error);
 narrated=level.key==='RENIN'&&!oracle&&i===3&&cutoff===.8&&error==='hard'&&active.frames.length===reninStory.length&&reninStory.every((cue,j)=>{
  const frame=active.frames[j];
  return frame.action===cue.action&&(!cue.name||level.products[frame.targets[0]].name===cue.name)&&(!cue.count||frame.targets.length===cue.count);
 });
 const preset=replayDefaults(level.key);
 deck=!oracle&&i===3&&cutoff===+preset.cut&&error===preset.error?campaignDeck(level,active):null;
 const dollars=n=>n===null?'unreached':'$'+n;
 if(summary){
  $('sample').textContent='Median replay · '+dollars(summary.median)+' to hit · 10th–90th percentile '+dollars(summary.low)+'–'+dollars(summary.high)+' · '+summary.wins+'/'+summary.count+' reached the hit. ';
 }else{
  $('sample').textContent=oracle?'Known winner · direct synthesis $'+active.directCost+'. ':'Deterministic replay. ';
 }
 const key=$('target').value;
 $('boardLink').href='medicinal_chemistry_world_map.html#'+key+'/'+(oracle||error==='ideal'?replayDefaults(key).error:error)+'/'+$('cut').value;
 $('storyLink').href=key+'_intro.html';

 liveLevel={...level,edges:level.edges.filter(e=>e[2]>=cutoff-1e-12)};
 projection=project(key,liveLevel,active,data.native[key],oracle||error==='ideal');
 generation++;ready.clear();$('game').srcdoc=embed(data.gameTemplate,'__LEVELS__',{[key]:liveLevel});
 $('brainPane').srcdoc=embed(data.brainTemplate,'__DEMO_DATA__',projection.D);fit();
 $('cutLabel').hidden=!(usesFep||(oracle&&$('route').value==='fep'));$('errorLabel').hidden=!usesFep;$('routeLabel').hidden=!oracle;show(0);
}
function chooseTarget(){setup();}
options($('policy'),[...moviePolicies.map((p,i)=>[i,p[1]]),['oracle','Hindsight oracle']]);$('policy').value='3';
options($('target'),Object.keys(data.boards).map(k=>[k,k]));
const [campaignKey,modeKey,policyKey,cutKey,entryKey]=location.hash.slice(1).split('/');
$('target').value=data.boards[campaignKey]?campaignKey:'RENIN';
function applyDefaults(){
 const defaults=replayDefaults($('target').value);
 $('cut').value=defaults.cut;$('error').value=defaults.error;
}
applyDefaults();
if(['ideal',...Object.keys(gameErrorScale)].includes(modeKey))$('error').value=modeKey;
if(policyKey==='hindsight'||policyKey==='oracle')$('policy').value='oracle';
else if(['0','1','2','3'].includes(policyKey))$('policy').value=policyKey;
if(['0.60','0.70','0.80','0.90'].includes(cutKey))$('cut').value=cutKey;
chooseTarget();
if(entryKey==='ranks'||entryKey==='choice'){
 const firstPick=run().frames.findIndex(f=>f.ranking);
 if(firstPick>=0)show(firstPick);
}
$('target').onchange=()=>{applyDefaults();chooseTarget();};$('route').onchange=$('cut').onchange=$('error').onchange=$('policy').onchange=setup;$('focus').onchange=()=>show(index,true);
function step(i){setPlaying(false);show(i);}
function forward(){
 if(segment==='intro'){setPlaying(false);startAction();return;}
 if(segment==='outro'){finishReplay();return;}
 if(index<run().frames.length-1)step(index+1);else if(segment==='action'){setPlaying(false);setPhase('settled');advanceClock();}
}
$('withSlides').onchange=()=>{if(!$('withSlides').checked&&segment==='intro')startAction();else if(segment==='outro')finishReplay();else if($('withSlides').checked)show(index);};
$('reveal').onclick=()=>{if(segment==='outro')finishReplay();else{setPlaying(false);startAction();}};
$('prev').onclick=()=>step(index-1);$('next').onclick=forward;$('scrub').oninput=e=>step(+e.target.value);
$('play').onclick=()=>{if(segment==='outro'){finishReplay();return;}if(segment==='finished'){show(0);setPlaying(true);}else setPlaying(!playing);};
$('play').textContent=playing?'Pause':'Play';
document.addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(e.target.tagName))return;
 if(e.key==='ArrowRight'){e.preventDefault();forward();}else if(e.key==='ArrowLeft'){e.preventDefault();step(index-1);}
 else if(e.key==='Escape'&&segment==='intro'){startAction();}
});
</script></html>

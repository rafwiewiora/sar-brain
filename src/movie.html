<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAR Brain · Strategy replay</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#162b43;font:16px/1.4 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:10px 2vw}header,nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}header{padding:6px 0 12px;border-bottom:1px solid #dbe3ef}header strong{margin-right:auto}a{color:#235ce4}button,select{font:inherit;border:1px solid #bccbdf;border-radius:5px;background:white;padding:5px 9px;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}#play{background:#235ce4;color:white;border-color:#235ce4}figure{margin:0 auto;max-width:min(100%,calc((100svh - 160px)*1.82))}figure>svg{display:block;width:100%;height:auto}nav{padding:10px 0;border-top:1px solid #dbe3ef}input{flex:1;min-width:90px;accent-color:#235ce4}footer{color:#52647c;font-size:14px;margin:4px 0}label{font-size:14px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2972fc}@media(max-width:700px){main{padding:6px}header,nav{gap:6px}figure{overflow-x:auto;max-width:100%}figure>svg{min-width:780px}}
main{max-width:none;padding:0}header,nav{padding:8px 14px}header{gap:10px}header strong{font-size:15px}footer{padding:0 14px}
#scene{margin:0;max-width:none;display:grid;grid-template-columns:1fr 1fr;border-block:1px solid #dbe3ef;height:calc(100svh - 135px);min-height:390px}section.pane{position:relative;min-width:0;overflow:hidden;background:white}section.pane+section{border-left:2px solid #cbd5e1}.pane iframe{position:absolute;top:0;left:0;transform-origin:top left;border:0;background:white}body{overflow-x:hidden}nav{border:0}.pane:fullscreen iframe{background:white}
@media(max-width:740px){#scene{display:flex;flex-direction:column;height:auto}.pane{height:75vw;min-height:300px}.pane+section.pane{border-left:0;border-top:2px solid #cbd5e1}}@media(min-width:741px) and (max-width:1100px){#scene{height:calc(100svh - 170px)}}
.paneLabel{height:25px;font:600 12px/24px system-ui;padding:0 14px;color:#243853;border-bottom:1px solid #dbe3ef;background:#f8fafc}.paneLabel span{font-weight:400;color:#52647c;margin-left:8px}.pane iframe{top:25px}</style><main><header><strong>SAR Brain</strong><label>Campaign <select id="target"></select></label><label>Strategy <select id="policy"></select></label><label id="routeLabel" hidden>Oracle route <select id="route"><option value="fep">Shortest FEP path</option><option value="direct">Direct synthesis</option></select></label><label id="cutLabel">LoMap ≥ <select id="cut"><option>0.60</option><option>0.70</option><option>0.80</option><option>0.90</option></select></label><label id="errorLabel">Difficulty <select id="error"><option value="ideal">Ideal (0 error)</option><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><a id="storyLink">Story slides</a><a id="filmLink" href="RENIN_strategy_movie.mp4">RENIN film</a><a id="boardLink" href="medicinal_chemistry_world_map.html">Play the board</a></header>
<figure id="scene"><section class="pane"><div class="paneLabel">Agent decision <span>Selected action</span></div><iframe id="game" title="Medicinal chemistry board"></iframe></section><section class="pane"><div class="paneLabel">Campaign state <span>Recorded state</span></div><iframe id="brainPane" title="SAR Brain campaign viewer"></iframe></section></figure><nav><button id="prev" aria-label="Previous action">←</button><button id="play">Play</button><button id="next" aria-label="Next action">→</button><output id="count" aria-live="polite"></output><input id="scrub" type="range" min="0" aria-label="Replay action"><label>Inspect <select id="focus"></select></label></nav><footer><strong id="sample"></strong> <span id="rule"></span></footer></main>
<script id="data" type="application/json">__DATA__</script><script>__SCENE__
const data=JSON.parse(document.querySelector('#data').textContent),$=id=>document.getElementById(id);
let index=0,timer=null, projection,liveLevel,generation=0,tick=0,ready=new Set(),painted=new Set();
const frameEl=side=>$(side==='board'?'game':'brainPane');
function fit(){
 for(const el of [$('game'),$('brainPane')]){
  const box=el.parentElement.getBoundingClientRect(),w=Math.max(1120,box.width),scale=box.width/w;
  el.style.width=w+'px';el.style.height=Math.floor((box.height-25)/scale)+'px';el.style.transform='scale('+scale+')';
 }
}
new ResizeObserver(fit).observe($('scene'));window.addEventListener('resize',fit);
function put(side,msg){frameEl(side).contentWindow.postMessage(msg,'*');}
let phase='settled',phaseTimers=[],inspected=false;
function duration(){
 if(run().frames[index].ranking)return 4.5;
 return Math.max(1.05,projection.D.paths.movie[index].seconds??2.6);
}
const moments=[['aim',0],['press',.17],['pop',.39],['settled',.65]];
function setPhase(value){
 phase=value;tick++;painted.clear();delete document.body.dataset.ready;sync();
}
function sync(){
 if(!projection||ready.size<2)return;
 const f=run().frames[index],intent=f.action==='open'?'':f.action;
 const after=phase==='pop'||phase==='settled',prior=Math.max(0,index-1),at=after?index:prior;
 const old=run().frames[prior],dq=f.queries-old.queries,ds=f.spent-old.spent;
 const delta={queries:dq,steps:ds,money:dq+ds};
 const focus=projection.node($('focus').value),beat=projection.D.paths.movie[index];
 const pair=phase==='settled'&&['prediction','assay'].includes(beat.beat)&&projection.cid(focus)===beat.candidate?
   {from:projection.node(beat.reference),to:projection.node(beat.candidate),measured:beat.beat==='assay'}:null;
 const decision={ranking:f.ranking,parents:f.parents,model:f.decision?.model,estimate:f.decision?.estimate,unlocked:[]};
 if(liveLevel.key==='RENIN'&&intent==='make'&&!isOracle()&&[2,3].includes(+$('policy').value)){
  const priorSet=new Set(old.made),now=new Set(f.made);
  const reachable=new Set();
  for(const [a,b] of liveLevel.edges){if(priorSet.has(a))reachable.add(b);if(priorSet.has(b))reachable.add(a);}
  const newly=new Set();
  for(const [a,b] of liveLevel.edges){
   if(now.has(a)&&!now.has(b)&&!reachable.has(b))newly.add(b);
   if(now.has(b)&&!now.has(a)&&!reachable.has(a))newly.add(a);
  }
  decision.unlocked=[...newly];
 }
 put('board',{type:'board-frame',index,tick,phase,delta,pair,focus,decision,inspected,f:projection.states[at],
   info:after?beat.caption:'',playAction:intent==='query'&&!isOracle()?'query-all':intent,targets:f.targets,cutoff:$('cut').value,archived:false,setting:isOracle()?'ideal':$('error').value});
 put('brain',{type:'brain-frame',index:at,tick,phase,delta,focus:projection.cid(after?focus:old.targets[old.targets.length-1])});
}
window.addEventListener('message',e=>{
 const side=['board','brain'].find(k=>e.source===frameEl(k).contentWindow);if(!side)return;
 if(e.data?.type==='loaded'){if(e.data.generation!==generation)return;ready.add(side);sync();}
 if(e.data?.type==='painted'&&e.data.tick===tick){painted.add(side);if(painted.size===2)document.body.dataset.ready=String(tick);}
 if(e.data?.type==='navigate'){if(e.data.delta===0)$('play').click();else step(index+e.data.delta);}
});
function embed(template,marker,payload){
 const safe=JSON.stringify(payload).replaceAll('<','\\u003c');
 return template.replace(marker,()=>safe).replaceAll("type:'loaded',side:","generation:"+generation+",type:'loaded',side:");
}

let active;
const isOracle=()=>$('policy').value==='oracle';
const board=()=>data.boards[$('target').value],run=()=>active;
function options(el,items){el.replaceChildren(...items.map(([v,t])=>new Option(t,v)));}
function stop(){clearTimeout(timer);timer=null;$('play').textContent='Play';}
function show(i,keep=false){
 inspected=keep;
 const r=run(),b=board();index=Math.max(0,Math.min(i,r.frames.length-1));const f=r.frames[index];
 if(!keep){options($('focus'),f.targets.map(n=>[n,b.products[n].name]));$('focus').value=f.targets.reduce((a,c)=>(f.action==='query'?(f.forecasts?.[a]??b.products[a].p)>(f.forecasts?.[c]??b.products[c].p):b.products[a].p>b.products[c].p)?a:c);}
 const beat=projection.D.paths.movie[index];
 if(!keep&&beat.beat==='prediction')$('focus').value=projection.node(beat.candidate);
 phaseTimers.forEach(clearTimeout);phaseTimers=[];
 const animated=index>0&&!keep;
 setPhase(animated?'aim':'settled');
 if(animated&&!window.capturePhases){
  for(const [name,fraction] of moments.slice(1))phaseTimers.push(setTimeout(()=>setPhase(name),duration()*1000*fraction));
 }
 $('count').textContent=(index+1)+' / '+r.frames.length;$('scrub').max=r.frames.length-1;$('scrub').value=index;
 $('prev').disabled=index===0;$('next').disabled=index===r.frames.length-1;if($('next').disabled)stop();
 $('rule').textContent=r.rule+(index===r.frames.length-1?'  '+(r.end||(Math.max(...f.made.map(n=>b.products[n].p))===Math.max(...Object.values(b.products).map(x=>x.p))?'Winner assayed.':'No eligible move remains.')):'');
}
function setup(){
 stop();const i=+$('policy').value;
 const cutoff=+$('cut').value,error=$('error').value;
 const oracle=isOracle(),usesFep=i===2||i===3;
 const summary=usesFep&&error!=='ideal'?data.draws[$('target').value][[i,cutoff,error]]:null;
 const level=summary?sampledLevel(board(),summary.seed):board();
 active=oracle?hindsightReplay(level,cutoff,$('route').value==='direct'):playStrategy(level,moviePolicies[i],cutoff,error);
 const dollars=n=>n===null?'unreached':'$'+n;
 if(summary){
  $('sample').textContent='Median replay · '+dollars(summary.median)+' to hit · 10th–90th percentile '+dollars(summary.low)+'–'+dollars(summary.high)+' · '+summary.wins+'/'+summary.count+' reached the hit. ';
 }else{
  $('sample').textContent=oracle?'Known winner · direct synthesis $'+active.directCost+'. ':'Deterministic replay. ';
 }
 const key=$('target').value;
 $('boardLink').href='medicinal_chemistry_world_map.html#'+key+'/'+(oracle||error==='ideal'?replayDefaults(key).error:error)+'/'+$('cut').value;
 $('storyLink').href=key+'_intro.html';
 $('filmLink').href=key+'_strategy_movie.mp4';$('filmLink').textContent=key+' film';
 liveLevel={...level,edges:level.edges.filter(e=>e[2]>=cutoff-1e-12)};
 projection=project(key,liveLevel,active,data.native[key],oracle||error==='ideal');
 generation++;ready.clear();$('game').srcdoc=embed(data.gameTemplate,'__LEVELS__',{[key]:liveLevel});
 $('brainPane').srcdoc=embed(data.brainTemplate,'__DEMO_DATA__',projection.D);fit();
 $('cutLabel').hidden=!(usesFep||(oracle&&$('route').value==='fep'));$('errorLabel').hidden=!usesFep;$('routeLabel').hidden=!oracle;show(0);
}
function chooseTarget(){stop();setup();}
options($('policy'),[...moviePolicies.map((p,i)=>[i,p[1]]),['oracle','Hindsight oracle']]);$('policy').value='3';
options($('target'),Object.keys(data.boards).map(k=>[k,k]));
const [campaignKey,modeKey,policyKey,cutKey,entryKey]=location.hash.slice(1).split('/');
$('target').value=data.boards[campaignKey]?campaignKey:'RENIN';
function applyDefaults(){
 const defaults=replayDefaults($('target').value);
 $('cut').value=defaults.cut;$('error').value=defaults.error;
}
applyDefaults();
if(['ideal',...Object.keys(gameErrorScale)].includes(modeKey))$('error').value=modeKey;
if(policyKey==='hindsight'||policyKey==='oracle')$('policy').value='oracle';
else if(['0','1','2','3'].includes(policyKey))$('policy').value=policyKey;
if(['0.60','0.70','0.80','0.90'].includes(cutKey))$('cut').value=cutKey;
chooseTarget();
if(entryKey==='ranks'||entryKey==='choice'){
 const firstPick=run().frames.findIndex(f=>f.ranking);
 if(firstPick>=0)show(firstPick);
}
$('target').onchange=()=>{applyDefaults();chooseTarget();};$('route').onchange=$('cut').onchange=$('error').onchange=$('policy').onchange=setup;$('focus').onchange=()=>show(index,true);
function step(i){stop();show(i);}
$('prev').onclick=()=>step(index-1);$('next').onclick=()=>step(index+1);$('scrub').oninput=e=>step(+e.target.value);
$('play').onclick=()=>{if(timer){stop();return;}if(index===run().frames.length-1)show(0);function advance(){
  timer=setTimeout(()=>{show(index+1);if(timer)advance();},duration()*1000);
 }advance();$('play').textContent='Pause';};
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON','A'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();step(index+(e.key==='ArrowRight'?1:-1));}});
</script></html>

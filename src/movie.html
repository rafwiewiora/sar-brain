<script id="data" type="application/json">__DATA__</script><script>__SCENE__
const data=JSON.parse(document.querySelector('#data').textContent),$=id=>document.getElementById(id);
let index=0,timer=null, projection,liveLevel,generation=0,tick=0,ready=new Set(),painted=new Set();
const frameEl=side=>$(side==='board'?'game':'brainPane');
function fit(){
 for(const el of [$('game'),$('brainPane')]){
  const box=el.parentElement.getBoundingClientRect(),w=Math.max(1000,box.width),scale=box.width/w;
  el.style.width=w+'px';el.style.height=Math.floor((box.height-25)/scale)+'px';el.style.transform='scale('+scale+')';
 }
}
new ResizeObserver(fit).observe($('scene'));window.addEventListener('resize',fit);
function put(side,msg){frameEl(side).contentWindow.postMessage(msg,'*');}
let phase='settled',inspected=false;
let playing=false,segment='intro',remaining=0,deadline=0,deck=null;
// Narration belongs to the published RENIN replay and its paired SAR comparison.
const reninStory = [
 {action:'open',after:['Find a 1 nM renin inhibitor','Start with 15 assays. Each new synthesis step and each simulated FEP prediction costs $1.']},
 {action:'query',count:5,before:['Which molecules look worth making?','The agent can predict five neighbors of its measured compounds. Other candidates keep their SAR estimates.'],after:['Five predictions change the shortlist','CPD 177 rises to first. The agent commits to two compounds in this batch.']},
 {action:'make',name:'CPD 177',before:['Test the first prediction','CPD 177 ranks first with FEP. Preparing and assaying it takes nine synthesis steps.'],after:['The first prediction is too optimistic','FEP predicted 78 nM for CPD 177. The assay gives 513 nM.'],focus:'assay',tone:'caution'},
 {action:'make',name:'CPD 121',before:['The first synthesis also made an intermediate','Reusing it cuts the price of CPD 121 from nine steps to two.'],after:['Two more steps buy a stronger compound','CPD 121 measures 115 nM. Its batch partner already paid for the shared chemistry.'],focus:'price'},
 {action:'query',count:19,before:['New references extend FEP’s reach','The two assays make 19 more compounds eligible for prediction.'],after:['Choose the next pair','Using the new predictions and current synthesis prices, the agent selects CPD 223 and CPD 239.']},
 {action:'make',name:'CPD 223',before:['Test the next prediction','CPD 223 takes two steps from the current stock.'],after:['CPD 223 sets a new best','Its measured potency is 6 nM. One more compound is already committed in this batch.'],focus:'assay'},
 {action:'make',name:'CPD 239',before:['Make the second compound in the batch','CPD 239 also takes two synthesis steps. Its assay will make it available as an FEP reference.'],after:['A weaker compound opens the decisive link','At 9 nM, CPD 239 trails the 6 nM lead. It gives the agent its first eligible FEP link to CPD 270.'],focus:'link'},
 {action:'query',count:1,before:['One new prediction is available','CPD 270 ranks eighth under the active strategy. The agent can now query it from CPD 239.'],after:['One prediction changes the decision','FEP predicts 1.01 nM. CPD 270 moves from eighth to first. Both SAR columns still rank it fourteenth.'],focus:'rank'},
 {action:'make',name:'CPD 270',before:['Spend two steps to test CPD 270','The 1.01 nM value is a noisy prediction. The agent must make the compound and assay it.'],after:['The assay confirms 1 nM','This replay used 17 synthesis steps versus 21 for SAR + cost (19% fewer). With 25 FEP queries, it spent $42 versus $21.'],focus:'assay'}
];
let narrated=false;
function addedStages(frameIndex){
 if(!frameIndex)return [];
 const f=run().frames[frameIndex],before=new Set(run().frames[frameIndex-1].stock);
 return f.stock.filter(n=>!before.has(n));
}
function actionPhases(index){
 if(run().won&&index===run().frames.length-1)return index?['aim','press','charge']:[];
 if(!index)return ['settled'];
 const f=run().frames[index],phases=['aim','press','charge'];
 if(f.liveRanks){
  phases.push('pop');
  const col=f.liveRanks.activeColumn;
  const leaders=snapshot=>snapshot.entries.filter(e=>e.ranks[col]<=3).map(e=>e.id);
  const previous=leaders(run().frames[index-1]?.liveRanks??f.liveRanks),now=leaders(f.liveRanks);
  if(previous.some(id=>!now.includes(id)))phases.push('depart');
  if(now.some(id=>!previous.includes(id)))phases.push('arrive');
 }
 if(addedStages(index).length)phases.push('inventory');
 phases.push('settled');
 return phases;
}
let rankProgress=null;
function setPhase(value,progress=null){
 rankProgress=progress;phase=value;tick++;painted.clear();delete document.body.dataset.ready;sync();
}
function sync(){
 if(!projection||ready.size<2)return;
 const holding=segment==='intro'&&index>0;
 paintFrame(holding?index-1:index,holding?'settled':phase,holding);
}
function paintFrame(index,phase,holding){
 const f=run().frames[index],intent=f.action==='open'?'':f.action;
 const after=phase!=='aim'&&phase!=='press',prior=Math.max(0,index-1),at=after?index:prior;
 const old=run().frames[prior],dq=f.queries-old.queries,ds=f.spent-old.spent;
 const delta={queries:dq,steps:ds,money:dq+ds};
 const beat=projection.D.paths.movie[index];
 const focus=holding?projection.node(beat.candidate||f.targets.at(-1)):projection.node($('focus').value);
 const pair=phase==='settled'&&['prediction','assay'].includes(beat.beat)&&projection.cid(focus)===beat.candidate?
   {from:projection.node(beat.reference),to:projection.node(beat.candidate),measured:beat.beat==='assay'}:null;
 const cue=narrated?reninStory[index]:null;
 const story=cue&&$('withSlides').checked?{lines:after?cue.after:cue.before,focus:after?cue.focus:undefined,tone:cue.tone}:null;
 const decision={story,ranking:f.ranking,beforeRanks:old.liveRanks,afterRanks:f.liveRanks,
   axisCount:run().frames[0].liveRanks?.entries.length,progress:rankProgress,animateMs:1250/PLAYBACK_RATE,addedStages:addedStages(index),stock:f.stock,parents:f.parents,model:f.decision?.model,estimate:f.decision?.estimate,unlocked:[]};
 if(liveLevel.key==='RENIN'&&intent==='make'&&!isOracle()&&[2,3].includes(+$('policy').value)){
  const priorSet=new Set(old.made),now=new Set(f.made);
  const reachable=new Set();
  for(const [a,b] of liveLevel.edges){if(priorSet.has(a))reachable.add(b);if(priorSet.has(b))reachable.add(a);}
  const newly=new Set();
  for(const [a,b] of liveLevel.edges){
   if(now.has(a)&&!now.has(b)&&!reachable.has(b))newly.add(b);
   if(now.has(b)&&!now.has(a)&&!reachable.has(a))newly.add(a);
  }
  decision.unlocked=[...newly];
 }
 put('board',{type:'board-frame',index,tick,phase,delta,pair,focus,decision,inspected,f:projection.states[phase==='charge'?prior:at],cash:f.spent+f.queries,
   info:after?beat.caption:'',playAction:intent==='query'&&!isOracle()?'query-all':intent,targets:f.targets,cutoff:$('cut').value,archived:false,setting:isOracle()?'ideal':$('error').value});
 put('brain',{type:'brain-frame',transport:transportState(),autoView:narrated&&$('withSlides').checked?(index===2||index===3?'retro':'brain'):null,watchSquare:narrated&&$('withSlides').checked&&index===2?'CPD_121':null,moveIndex:index,index:at,tick,phase:phase==='charge'?'pop':after?'settled':phase,delta,focus:projection.cid(after?focus:old.targets[old.targets.length-1])});
}
window.addEventListener('message',e=>{
 const side=['board','brain'].find(k=>e.source===frameEl(k).contentWindow);if(!side)return;
 if(e.data?.type==='loaded'){if(e.data.generation!==generation)return;ready.add(side);sync();}
 if(e.data?.type==='painted'&&e.data.tick===tick){painted.add(side);if(painted.size===2){document.body.dataset.ready=String(tick);startClock();}}
 if(e.data?.type==='navigate'){if(e.data.delta===0)$('play').click();else navigateBeat(e.data.delta);}
});
function embed(template,marker,payload){
 const safe=JSON.stringify(payload).replaceAll('<','\\u003c');
 return template.replace('<html','<html style="--replay-rate:'+PLAYBACK_RATE+'"').replace(marker,()=>safe).replaceAll("type:'loaded',side:","generation:"+generation+",type:'loaded',side:");
}

let active;
const isOracle=()=>$('policy').value==='oracle';
const board=()=>data.boards[$('target').value],run=()=>active;
function options(el,items){el.replaceChildren(...items.map(([v,t])=>new Option(t,v)));}
const PLAYBACK_RATE=0.75;
const SCENE_HOLD_MS=5000, SLIDE_MS=10000;
const phaseMotion={aim:850,press:1050,charge:2900,pop:2150,depart:2750,arrive:2900,inventory:2500,settled:900};
let timeline=[],beatIndex=0,countInterval=null;
function makeTimeline(){
 timeline=[];
 run().frames.forEach((frame,index)=>{
  if($('withSlides').checked)timeline.push({index,segment:'intro',phase:index?'aim':'settled'});
  for(const phase of actionPhases(index))timeline.push({index,segment:'action',phase});
 });
 if(run().won)for(const segment of ['outro','comparison'])timeline.push({index:run().frames.length-1,segment,phase:'result'});
 for(const [i,beat] of timeline.entries()){
  if(beat.segment!=='action'){beat.hold=beat.segment==='outro'?SCENE_HOLD_MS:SLIDE_MS;continue;}
  const next=timeline[i+1];
  beat.hold=beat.phase==='settled'&&(next?.segment==='intro'||next?.segment==='outro')?SCENE_HOLD_MS:0;
 }
}
function timeLeft(){return timer===null?remaining:Math.max(0,deadline-performance.now());}
function displayTime(){
 const left=timeLeft(),hold=timeline[beatIndex]?.hold??SLIDE_MS;
 const showCountdown=hold>0&&left<=hold;
 $('countdown').style.visibility=segment==='finished'||showCountdown?'visible':'hidden';
 $('countdown').classList.toggle('done',segment==='finished');
 const label=segment==='finished'?'Done':Math.ceil(left/1000)+' s';
 if($('countdown').textContent!==label)$('countdown').textContent=label;
}
function stopClock(){
 remaining=timeLeft();
 clearTimeout(timer);clearInterval(countInterval);timer=null;countInterval=null;
}
function startClock(){
 if(!playing||timer!==null||document.body.dataset.ready!==String(tick))return;
 deadline=performance.now()+remaining;
 timer=setTimeout(()=>navigateBeat(1),remaining);
 countInterval=setInterval(displayTime,100);
 displayTime();
}
function transportState(){
 return {playing,canBack:beatIndex>0||segment==='finished',canForward:segment!=='finished'};
}
function setPlaying(value){
 stopClock();playing=value;
 $('play').textContent=segment==='finished'?'Replay':playing?'Pause':'Play';
 for(const side of ready)put(side,{type:'clock',paused:!playing,transport:transportState()});
 displayTime();startClock();
}
function genericCard(f){
 const b=board(),previous=run().frames[Math.max(0,index-1)];
 const title=f.action==='open'?'Start with '+f.made.length+' measured references':f.action==='query'?'Predict '+f.targets.length+' eligible compounds':'Make and assay '+b.products[f.targets[0]].name;
 const ids=f.targets.slice(0,3),visual='<div class="gallery">'+ids.map(n=>'<div class="mol">'+b.drawings[n]+'<b>'+b.products[n].name+'</b></div>').join('')+'</div>';
 const foot=f.action==='make'?(f.spent-previous.spent)+' synthesis steps from current inventory.':f.action==='query'?'One simulated FEP query per eligible compound.':'Opening compounds and their assays are supplied.';
 return [title,visual,foot];
}
function cardForStep(){
 const f=run().frames[index];
 if(!deck)return genericCard(f);
 const slide=narrated?[1,2,3,4,null,null,5,6,7][index]:deck.slideForFrame.get(f);
 if(slide===undefined)return genericCard(f);
 if(narrated&&index===0)return [deck.slides[slide][0],deck.slides[slide][1],reninStory[0].after[1]+' The goal is a 1 nM inhibitor.'];
 if(slide!==null)return deck.slides[slide];
 if(f.action==='query')return [reninStory[index].before[0],deck.ledger([[f.targets.length,'new FEP queries'],['$'+(f.queries-run().frames[index-1].queries),'cost of this screen']]),reninStory[index].before[1]];
 return [reninStory[index].before[0],deck.gallery([deck.mol(f.targets[0],'Selected for assay')]),reninStory[index].before[1]];
}
function layoutSheet(){
 const r=$('scene').getBoundingClientRect();
 document.documentElement.style.setProperty('--sheet-top',Math.max(0,r.top)+'px');
 document.documentElement.style.setProperty('--sheet-bottom',Math.max(0,innerHeight-r.bottom)+'px');
}
function showCard(card,closing=false){
 $('stepSheet').classList.toggle('victory',closing&&run().won);
 layoutSheet();$('sheetKicker').textContent=$('target').value+' · '+(closing?'Campaign result':'Move '+(index+1)+' of '+run().frames.length);
 $('sheetTitle').textContent=card[0];$('sheetVisual').innerHTML=card[1];$('sheetNote').innerHTML=card[2];
 $('reveal').textContent=closing?'Compare strategies →':'Play this move →';$('stepSheet').hidden=false;
}
function dockResult(docked){
 const sheet=$('stepSheet');
 sheet.classList.toggle('docked',docked);
 if(docked)$('game').parentElement.append(sheet);
 else $('scene').after(sheet);
}
function finishReplay(){
 const keepComparison=segment==='comparison';
 segment='finished';setPlaying(false);
 if(keepComparison){dockResult(true);$('reveal').hidden=true;}
 else $('stepSheet').hidden=true;
 $('next').disabled=true;$('prev').disabled=false;
}
function showVictory(){
 const f=run().frames[index],b=board(),id=f.made.reduce((best,n)=>b.products[n].p>b.products[best].p?n:best);
 const potency=Number((10**(9-b.products[id].p)).toPrecision(3))+' nM';
 const detail=b.products[id].name+' · '+potency+' measured';
 const costs=f.spent+' synthesis steps · '+f.queries+' FEP queries · $'+(f.spent+f.queries)+' spent';
 showCard(['Campaign won',b.drawings[id]+'<h2>'+detail+'</h2>',costs+(narrated?' · 19% fewer synthesis steps than SAR + cost (21 steps).':'')],true);
 dockResult(true);
}
function showComparison(){
 const b=board(),cut=+$('cut').value,error=isOracle()?'ideal':$('error').value;
 const winner=run().frames.at(-1).made.reduce((a,c)=>b.products[c].p>b.products[a].p?c:a);
 const chart=metric=>strategyComparison(b,data.draws[b.key],cut,error,metric,b.products[winner].name);
 const controls='<label>Compare <select id="resultMetric"><option value="stepInterval">Synthesis steps</option><option value="moneyInterval">Total spend ($)</option></select></label>';
 const note=error==='ideal'?'Ideal FEP · deterministic results.':'Dots show medians. Whiskers span the middle 50% of 101 FEP error draws.';
 showCard(['Four strategies, one opening inventory',controls+'<div id="resultChart">'+chart('stepInterval')+'</div>',note]);
 $('sheetKicker').textContent=b.key+' · Strategy comparison · LoMap ≥ '+cut.toFixed(2)+' · '+error+' FEP';
 $('resultMetric').onchange=e=>{$('resultChart').innerHTML=chart(e.target.value);};
 $('reveal').textContent='Finish →';
}
window.addEventListener('resize',layoutSheet);

function displayBeat(position){
 stopClock();
 beatIndex=position;
 const beat=timeline[position],changedMove=index!==beat.index;
 index=beat.index;segment=beat.segment;
 const f=run().frames[index],b=board(),r=run();
 if(changedMove||!$('focus').options.length){
  options($('focus'),f.targets.map(n=>[n,b.products[n].name]));
  $('focus').value=f.targets.reduce((a,c)=>(f.action==='query'?(f.forecasts?.[a]??b.products[a].p)>(f.forecasts?.[c]??b.products[c].p):b.products[a].p>b.products[c].p)?a:c);
  const storyBeat=projection.D.paths.movie[index];
  if(storyBeat.beat==='prediction')$('focus').value=projection.node(storyBeat.candidate);
 }
 if(changedMove)inspected=false;
 remaining=beat.hold||phaseMotion[beat.phase]/PLAYBACK_RATE;
 dockResult(false);$('reveal').hidden=false;$('stepSheet').hidden=true;
 if(segment==='intro')showCard(cardForStep());
 if(segment==='outro')showVictory();
 if(segment==='comparison')showComparison();
 setPhase(beat.phase);
 $('count').textContent=(index+1)+' / '+r.frames.length;
 $('scrub').max=r.frames.length-1;$('scrub').value=index;
 $('prev').disabled=position===0;$('next').disabled=false;
 $('rule').textContent=r.rule+(index===r.frames.length-1?'  '+(r.end||''):'');
 $('play').textContent=playing?'Pause':'Play';
 displayTime();
}
function navigateBeat(delta){
 if(segment==='finished'){
  if(delta<0)displayBeat(timeline.length-1);
  return;
 }
 const next=beatIndex+delta;
 if(next>=timeline.length){finishReplay();return;}
 if(next>=0)displayBeat(next);
}
function seekMove(i){displayBeat(timeline.findIndex(b=>b.index===i));}
function setup(){
 setPlaying(false);const i=+$('policy').value;
 const cutoff=+$('cut').value,error=$('error').value;
 const oracle=isOracle(),usesFep=i===2||i===3;
 const summary=usesFep&&error!=='ideal'?data.draws[$('target').value][[i,cutoff,error]]:null;
 const level=summary?sampledLevel(board(),summary.seed):board();
 active=oracle?hindsightReplay(level,cutoff,$('route').value==='direct'):playStrategy(level,moviePolicies[i],cutoff,error);
 narrated=level.key==='RENIN'&&!oracle&&i===3&&cutoff===.8&&error==='hard'&&active.frames.length===reninStory.length&&reninStory.every((cue,j)=>{
  const frame=active.frames[j];
  return frame.action===cue.action&&(!cue.name||level.products[frame.targets[0]].name===cue.name)&&(!cue.count||frame.targets.length===cue.count);
 });
 const preset=replayDefaults(level.key);
 deck=!oracle&&i===3&&cutoff===+preset.cut&&error===preset.error?campaignDeck(level,active):null;
 const dollars=n=>n===null?'unreached':'$'+n;
 if(summary){
  $('sample').textContent='Median replay · '+dollars(summary.median)+' to hit · 10th–90th percentile '+dollars(summary.low)+'–'+dollars(summary.high)+' · '+summary.wins+'/'+summary.count+' reached the hit. ';
 }else{
  $('sample').textContent=oracle?'Known winner · direct synthesis $'+active.directCost+'. ':'Deterministic replay. ';
 }
 const key=$('target').value;
 $('boardLink').href='medicinal_chemistry_world_map.html#'+key+'/'+(oracle||error==='ideal'?replayDefaults(key).error:error)+'/'+$('cut').value;
 $('storyLink').href=key+'_intro.html';

 liveLevel={...level,edges:level.edges.filter(e=>e[2]>=cutoff-1e-12)};
 projection=project(key,liveLevel,active,data.native[key],oracle||error==='ideal');
 generation++;ready.clear();$('game').srcdoc=embed(data.gameTemplate,'__LEVELS__',{[key]:liveLevel});
 $('brainPane').srcdoc=embed(data.brainTemplate,'__DEMO_DATA__',projection.D);fit();
 $('cutLabel').hidden=!(usesFep||(oracle&&$('route').value==='fep'));$('errorLabel').hidden=!usesFep;$('routeLabel').hidden=!oracle;$('focus').replaceChildren();makeTimeline();displayBeat(0);
}
function chooseTarget(){setup();}
options($('policy'),[...moviePolicies.map((p,i)=>[i,p[1]]),['oracle','Hindsight oracle']]);$('policy').value='3';
options($('target'),Object.keys(data.boards).map(k=>[k,k]));
const [campaignKey,modeKey,policyKey,cutKey,entryKey]=location.hash.slice(1).split('/');
$('target').value=data.boards[campaignKey]?campaignKey:'RENIN';
function applyDefaults(){
 const defaults=replayDefaults($('target').value);
 $('cut').value=defaults.cut;$('error').value=defaults.error;
}
applyDefaults();
if(['ideal',...Object.keys(gameErrorScale)].includes(modeKey))$('error').value=modeKey;
if(policyKey==='hindsight'||policyKey==='oracle')$('policy').value='oracle';
else if(['0','1','2','3'].includes(policyKey))$('policy').value=policyKey;
if(['0.60','0.70','0.80','0.90'].includes(cutKey))$('cut').value=cutKey;
chooseTarget();
if(entryKey==='ranks'||entryKey==='choice'){
 const firstPick=run().frames.findIndex(f=>f.ranking);
 if(firstPick>=0)seekMove(firstPick);
}
$('target').onchange=()=>{applyDefaults();chooseTarget();};$('route').onchange=$('cut').onchange=$('error').onchange=$('policy').onchange=setup;$('focus').onchange=()=>{inspected=true;sync();};
$('withSlides').onchange=()=>{
 const current=timeline[beatIndex],finished=segment==='finished';makeTimeline();
 const same=timeline.findIndex(b=>b.index===current.index&&b.segment===current.segment&&b.phase===current.phase);
 if(same>=0){displayBeat(same);if(finished)finishReplay();}else seekMove(index);
};
$('reveal').onclick=()=>{
 if(segment==='comparison'){finishReplay();return;}
 if(segment==='outro'){navigateBeat(1);return;}
 navigateBeat(1);setPlaying(true);
};
$('prev').onclick=()=>navigateBeat(-1);$('next').onclick=()=>navigateBeat(1);
$('scrub').oninput=e=>{setPlaying(false);seekMove(+e.target.value);};
$('play').onclick=()=>{if(segment==='finished')displayBeat(0);setPlaying(!playing);};
document.addEventListener('keydown',e=>{
 if(e.target.closest('select,input,textarea'))return;
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
  e.preventDefault();navigateBeat(e.key==='ArrowRight'?1:-1);
 }else if(e.code==='Space'){
  e.preventDefault();if(!e.repeat)$('play').click();
 }
});
